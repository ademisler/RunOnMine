[package]
name = "runonmine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
chrono = "0.4"
libfuzzer-sys = "0.4"
runonmine-browser = { path = "../crates/runonmine-browser" }
runonmine-connectors = { path = "../crates/runonmine-connectors" }
runonmine-core = { path = "../crates/runonmine-core" }
runonmine-mcp = { path = "../crates/runonmine-mcp" }
runonmine-oauth = { path = "../crates/runonmine-oauth" }
runonmine-platform = { path = "../crates/runonmine-platform" }
serde_json = "1.0"
toml = "0.9"
url = "2.5"

[workspace]
members = ["."]

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_engine"
path = "fuzz_targets/policy_engine.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oauth_models"
path = "fuzz_targets/oauth_models.rs"
test = false
doc = false
bench = false

[[bin]]
name = "browser_urls"
path = "fuzz_targets/browser_urls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "helper_frames"
path = "fuzz_targets/helper_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_sessions"
path = "fuzz_targets/mcp_sessions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_entries"
path = "fuzz_targets/archive_entries.rs"
test = false
doc = false
bench = false

[[bin]]
name = "approval_transitions"
path = "fuzz_targets/approval_transitions.rs"
test = false
doc = false
bench = false

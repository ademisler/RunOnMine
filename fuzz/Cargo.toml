[package]
name = "runonmine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
runonmine-core = { path = "../crates/runonmine-core" }
serde_json = "1.0"
toml = "0.9"
url = "2.5"

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_engine"
path = "fuzz_targets/policy_engine.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

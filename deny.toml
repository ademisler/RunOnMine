[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { crate = "clipboard-win", allow = ["BSL-1.0"] },
  { crate = "error-code", allow = ["BSL-1.0"] },
  { crate = "epaint_default_fonts", allow = ["Apache-2.0", "MIT", "OFL-1.1", "Ubuntu-font-1.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "notify", allow = ["CC0-1.0"] },
  { crate = "ksni", allow = ["Unlicense"] },
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/rust-x-bindings/rust-xcb.git"]

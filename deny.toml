[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml is pinned by xcb/wayland-scanner in desktop-control build/proc-macro paths and is not used for RunOnMine runtime XML parsing. Remove when upstream allows quick-xml >=0.41." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml is pinned by xcb/wayland-scanner in desktop-control build/proc-macro paths and is not used for RunOnMine runtime XML parsing. Remove when upstream allows quick-xml >=0.41." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { crate = "clipboard-win", allow = ["BSL-1.0"] },
  { crate = "error-code", allow = ["BSL-1.0"] },
  { crate = "epaint_default_fonts", allow = ["Apache-2.0", "MIT", "OFL-1.1", "Ubuntu-font-1.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

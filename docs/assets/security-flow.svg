<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">RunOnMine security flow</title>
  <desc id="desc">An AI service sends an MCP request to a local RunOnMine security boundary, which applies identity, root, policy and local approval checks before an operating-system tool runs.</desc>
  <rect width="1200" height="360" rx="32" fill="#f4f7f5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="52" y="106" width="220" height="148" rx="24" fill="#ffffff" stroke="#c8d5cf" stroke-width="2"/>
    <text x="162" y="163" text-anchor="middle" font-size="25" font-weight="700" fill="#071c17">AI service</text>
    <text x="162" y="199" text-anchor="middle" font-size="17" fill="#53645d">MCP tool request</text>
    <text x="162" y="226" text-anchor="middle" font-size="15" fill="#74847d">Model remains remote</text>

    <path d="M290 180h90" stroke="#1f8f68" stroke-width="5" stroke-linecap="round"/>
    <path d="m370 165 20 15-20 15" fill="none" stroke="#1f8f68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="398" y="52" width="404" height="256" rx="28" fill="#071c17"/>
    <text x="600" y="102" text-anchor="middle" font-size="27" font-weight="700" fill="#34d399">RunOnMine</text>
    <text x="600" y="132" text-anchor="middle" font-size="16" fill="#b8cec5">Local security boundary</text>
    <g font-size="16" fill="#ffffff">
      <text x="450" y="177">✓ Connector + principal identity</text>
      <text x="450" y="210">✓ Selected filesystem roots</text>
      <text x="450" y="243">✓ Policy + exact-action hash</text>
      <text x="450" y="276">✓ Local approval when required</text>
    </g>

    <path d="M820 180h90" stroke="#1f8f68" stroke-width="5" stroke-linecap="round"/>
    <path d="m900 165 20 15-20 15" fill="none" stroke="#1f8f68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="928" y="106" width="220" height="148" rx="24" fill="#ffffff" stroke="#c8d5cf" stroke-width="2"/>
    <text x="1038" y="163" text-anchor="middle" font-size="25" font-weight="700" fill="#071c17">Your machine</text>
    <text x="1038" y="199" text-anchor="middle" font-size="17" fill="#53645d">Approved local tool</text>
    <text x="1038" y="226" text-anchor="middle" font-size="15" fill="#74847d">macOS · Linux · Windows</text>
  </g>
</svg>

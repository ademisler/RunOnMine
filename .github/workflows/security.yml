name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-sweep
  cancel-in-progress: true

env:
  HOME: /home/runonmine-ci
  USER: runonmine-ci
  LOGNAME: runonmine-ci
  CARGO_HOME: /home/runonmine-ci/.cargo
  RUSTUP_HOME: /home/runonmine-ci/.rustup
  PATH: /home/runonmine-ci/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  security-sweep:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify isolated runner environment
        run: ./scripts/ci/verify-runner-environment.sh
      - name: Configure ephemeral Cargo target
        run: |
          target="${RUNNER_TEMP}/runonmine-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CARGO_TARGET_DIR=%s\n' "$target" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: ./scripts/ci/install-rust-toolchain.sh 1.95.0
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit,cargo-deny
      - name: Reject workspace dependency advisories
        run: cargo audit --deny warnings
      - name: Reject fuzz-harness dependency advisories
        run: cargo audit --deny warnings --file fuzz/Cargo.lock
      - name: Enforce dependency policy
        run: cargo deny check
      - name: Verify Gitleaks version
        run: gitleaks version | grep -Fx '8.24.3'
      - name: Scan complete Git history
        run: gitleaks git --redact --no-banner --verbose
      - name: Remove ephemeral build outputs
        if: always()
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then
            rm -rf -- "$CARGO_TARGET_DIR"
          fi

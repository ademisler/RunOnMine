name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo-audit
        run: |
          cargo audit --no-yanked \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
      - name: Verify ignored advisories remain build-only dependencies
        run: |
          cargo tree --target all -i quick-xml@0.30.0 | tee /tmp/quick-xml-030.txt
          cargo tree --target all -i quick-xml@0.39.4 | tee /tmp/quick-xml-039.txt
          grep -F '[build-dependencies]' /tmp/quick-xml-030.txt
          grep -F 'wayland-scanner' /tmp/quick-xml-039.txt
      - run: cargo deny check

  secret-scan:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Gitleaks version
        run: gitleaks version | grep -Fx '8.24.3'
      - name: Scan complete Git history
        run: gitleaks git --redact --no-banner --verbose

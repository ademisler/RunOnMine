name: Release candidate

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:
    inputs:
      profile:
        description: "Release profile"
        required: true
        type: choice
        default: private-beta
        options:
          - private-beta
          - public-beta

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_PROFILE: ${{ inputs.profile || 'private-beta' }}

jobs:
  release-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-dist@0.32.0
      - run: cargo run --locked -p xtask -- verify-versions
      - run: cargo run --locked -p xtask -- verify-release-tag --tag "${{ github.ref_name }}"
      - run: cargo run --locked -p xtask -- release-readiness --profile "${RELEASE_PROFILE}"
      - run: python3 scripts/release/check-duplicate-dependencies.py
      - name: Fail closed when public signing material is absent
        if: env.RELEASE_PROFILE == 'public-beta'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_NOTARY_KEY"
          test -n "$WINDOWS_SIGNING_PFX"
          test -n "$WINDOWS_SIGNING_PASSWORD"
      - run: dist plan --output-format=json

  macos-universal:
    needs: release-plan
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-dist@0.32.0,cargo-packager@0.11.8
      - name: Build cargo-dist headless archives
        run: >-
          dist build --artifacts=local
          --target=aarch64-apple-darwin --target=x86_64-apple-darwin
      - name: Build both desktop architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --workspace --exclude xtask
          cargo build --release --locked --target x86_64-apple-darwin --workspace --exclude xtask
      - run: cargo run --locked -p xtask -- universal-macos
      - run: cargo run --locked -p xtask -- package --target universal-apple-darwin
      - name: Validate macOS SBOM
        run: cargo run --locked -p xtask -- validate-sbom --path "$(find dist -maxdepth 1 -name '*universal-apple-darwin-unsigned.sbom.json' -print -quit)" --target universal-apple-darwin
      - run: cargo run --locked -p xtask -- stage-packager --target universal-apple-darwin
      - run: ./packaging/package-macos.sh
      - run: cargo run --locked -p xtask -- checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runonmine-macos-universal
          path: |
            dist/*
            target/distrib/*
          if-no-files-found: error

  linux:
    needs: release-plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            packager: packaging/Packager.linux-x86_64.toml
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            packager: packaging/Packager.linux-aarch64.toml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-dist@0.32.0,cargo-packager@0.11.8
      - run: dist build --artifacts=local --target=${{ matrix.target }}
      - name: Build headless applications
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --no-default-features -p runonmine -p runonmine-agent -p runonmine-helper
      - run: cargo run --locked -p xtask -- package --target ${{ matrix.target }}
      - name: Validate Linux SBOM
        run: cargo run --locked -p xtask -- validate-sbom --path "$(find dist -maxdepth 1 -name '*-${{ matrix.target }}-unsigned.sbom.json' -print -quit)" --target ${{ matrix.target }}
      - run: cargo run --locked -p xtask -- stage-packager --target ${{ matrix.target }}
      - run: cargo packager --release --config ${{ matrix.packager }}
      - run: cargo run --locked -p xtask -- checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runonmine-${{ matrix.target }}
          path: |
            dist/*
            target/distrib/*
          if-no-files-found: error

  windows:
    needs: release-plan
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-dist@0.32.0,cargo-packager@0.11.8
      - run: choco install nsis --yes --no-progress
      - run: dist build --artifacts=local --target=x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc --workspace --exclude xtask
      - run: cargo run --locked -p xtask -- package --target x86_64-pc-windows-msvc
      - name: Validate Windows SBOM
        shell: pwsh
        run: |
          $sbom = Get-ChildItem dist -Filter '*-x86_64-pc-windows-msvc-unsigned.sbom.json' | Select-Object -First 1
          if (-not $sbom) { throw 'Windows SBOM is missing' }
          cargo run --locked -p xtask -- validate-sbom --path $sbom.FullName --target x86_64-pc-windows-msvc
      - run: cargo run --locked -p xtask -- stage-packager --target x86_64-pc-windows-msvc
      - run: cargo packager --release --config packaging/Packager.windows.toml
      - run: cargo run --locked -p xtask -- checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runonmine-x86_64-pc-windows-msvc
          path: |
            dist/*
            target/distrib/*
          if-no-files-found: error

  publish-draft:
    needs: [macos-universal, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: artifacts/**/*
          body: |
            RunOnMine ${{ env.RELEASE_PROFILE }} candidate.
            Private-beta artifacts are intentionally unsigned. Public-beta publication remains blocked unless signing/notarization gates and clean-install evidence pass.
            Verify every artifact against its accompanying SHA-256 checksum before use.
            SBOM files are provided in CycloneDX JSON format.
            This draft does not change repository visibility.

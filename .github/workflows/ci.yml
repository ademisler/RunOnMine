name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test-headless-linux:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy
      - name: Lint headless workspace
        run: >-
          cargo clippy --workspace --exclude runonmine-desktop
          --no-default-features --all-targets --locked -- -D warnings
      - name: Test headless workspace
        run: >-
          cargo test --workspace --exclude runonmine-desktop
          --no-default-features --locked

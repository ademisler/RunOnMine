name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOME: /home/runonmine-ci
  USER: runonmine-ci
  LOGNAME: runonmine-ci
  CARGO_HOME: /home/runonmine-ci/.cargo
  RUSTUP_HOME: /home/runonmine-ci/.rustup
  PATH: /home/runonmine-ci/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: 0

jobs:
  linux-quality:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify isolated runner environment
        run: ./scripts/ci/verify-runner-environment.sh
      - name: Validate repository documentation
        run: python3 scripts/ci/check-docs.py
      - name: Validate clean-install evidence templates
        run: |
          python3 scripts/release/validate-clean-install-evidence.py acceptance/evidence/clean-install.template.json
          python3 scripts/release/validate-clean-install-evidence.py acceptance/evidence/clean-install.desktop.template.json
      - name: Configure ephemeral Cargo target
        run: |
          target="${RUNNER_TEMP}/runonmine-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CARGO_TARGET_DIR=%s\n' "$target" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: ./scripts/ci/install-rust-toolchain.sh 1.95.0 "rustfmt,clippy,llvm-tools-preview" ""
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov@0.8.7
      - name: Verify Gitleaks version
        run: gitleaks version | grep -Fx '8.24.3'
      - name: Run repository headless quality gates
        run: cargo run --locked -p xtask -- verify --headless
      - name: Lint desktop crate without unsupported Linux UI dependencies
        run: >-
          cargo clippy -p runonmine-desktop --no-default-features
          --all-targets --locked -- -D warnings
      - name: Test desktop crate headless contract
        run: cargo test -p runonmine-desktop --no-default-features --locked
      - name: Run MCP Streamable HTTP acceptance
        run: ./scripts/acceptance/mcp-http-smoke.sh
      - name: Enforce measured coverage targets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          cargo llvm-cov --workspace --exclude runonmine-desktop \
            --no-default-features --locked --lcov --output-path coverage.lcov
          python3 scripts/ci/check-lcov.py coverage.lcov \
            --global 70 --critical 90 --changed 80
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runonmine-coverage-lcov
          path: coverage.lcov
          if-no-files-found: error
      - name: Remove ephemeral build outputs
        if: always()
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then
            rm -rf -- "$CARGO_TARGET_DIR"
          fi
          rm -f -- coverage.lcov

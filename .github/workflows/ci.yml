name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOME: /home/runonmine-ci
  USER: runonmine-ci
  LOGNAME: runonmine-ci
  CARGO_HOME: /home/runonmine-ci/.cargo
  RUSTUP_HOME: /home/runonmine-ci/.rustup
  PATH: /home/runonmine-ci/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: 0

jobs:
  linux-quality:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify isolated runner environment
        run: ./scripts/ci/verify-runner-environment.sh
      - name: Configure ephemeral Cargo target
        run: |
          target="${RUNNER_TEMP}/runonmine-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CARGO_TARGET_DIR=%s\n' "$target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy,llvm-tools-preview
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov@0.8.7
      - name: Verify Gitleaks version
        run: gitleaks version | grep -Fx '8.24.3'
      - name: Run repository headless quality gates
        run: cargo run --locked -p xtask -- verify --headless
      - name: Lint desktop crate without unsupported Linux UI dependencies
        run: >-
          cargo clippy -p runonmine-desktop --no-default-features
          --all-targets --locked -- -D warnings
      - name: Test desktop crate headless contract
        run: cargo test -p runonmine-desktop --no-default-features --locked
      - name: Enforce headless line coverage baseline
        run: >-
          cargo llvm-cov --workspace --exclude runonmine-desktop
          --no-default-features --locked --fail-under-lines 45
          --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runonmine-coverage-lcov
          path: coverage.lcov
          if-no-files-found: error
      - name: Remove ephemeral build outputs
        if: always()
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then
            rm -rf -- "$CARGO_TARGET_DIR"
          fi
          rm -f -- coverage.lcov

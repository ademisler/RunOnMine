name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo run --locked -p xtask -- verify-versions

  test-headless-linux:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy
      - name: Lint headless workspace
        run: >-
          cargo clippy --workspace --exclude runonmine-desktop
          --no-default-features --all-targets --locked -- -D warnings
      - name: Test headless workspace
        run: >-
          cargo test --workspace --exclude runonmine-desktop
          --no-default-features --locked


  test-full-linux:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy
      - name: Lint complete workspace
        run: |
          export PATH="$CARGO_HOME/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test complete workspace
        run: |
          export PATH="$CARGO_HOME/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          cargo test --workspace --all-features --locked

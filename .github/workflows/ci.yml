name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  format:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0 with rustfmt
        run: |
          source "$HOME/.cargo/env"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - run: cargo +1.95.0 fmt --all --check

  test-headless-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0 with Clippy
        run: |
          source "$HOME/.cargo/env"
          rustup toolchain install 1.95.0 --profile minimal --component clippy
      - name: Lint headless workspace
        run: >-
          cargo +1.95.0 clippy --workspace --exclude runonmine-desktop
          --no-default-features --all-targets --locked -- -D warnings
      - name: Test headless workspace
        run: >-
          cargo +1.95.0 test --workspace --exclude runonmine-desktop
          --no-default-features --locked

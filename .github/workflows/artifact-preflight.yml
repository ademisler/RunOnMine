name: Artifact preflight

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: artifact-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install pinned Rust toolchain
        run: ./scripts/ci/install-rust-toolchain.sh 1.95.0 "" "${{ matrix.target }}"
      - name: Run isolated CLI and MCP acceptance
        run: |
          ./scripts/acceptance/cli-smoke.sh
          RUNONMINE_MCP_SOAK_ITERATIONS=25 ./scripts/acceptance/mcp-http-smoke.sh
      - name: Build native portable artifact
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --no-default-features -p runonmine -p runonmine-agent -p runonmine-helper
      - run: cargo run --locked -p xtask -- package --target ${{ matrix.target }}
      - name: Validate SBOM and artifact
        run: |
          sbom=$(find dist -maxdepth 1 -name '*-${{ matrix.target }}-unsigned.sbom.json' -print -quit)
          archive=$(find dist -maxdepth 1 \( -name '*-${{ matrix.target }}-unsigned.tar.gz' -o -name '*-${{ matrix.target }}-unsigned.zip' \) -print -quit)
          cargo run --locked -p xtask -- validate-sbom --path "$sbom" --target ${{ matrix.target }}
          ./scripts/acceptance/package-inspect.sh "$archive" "$sbom"
          python3 scripts/acceptance/write-artifact-preflight.py \
            --platform ${{ matrix.platform }} --artifact "$archive" \
            --output "dist/${{ matrix.platform }}-preflight.json" \
            --checks build,checksum,setup,agent_ready,mcp_initialize,approved_tool_call,uninstall,residue_check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runonmine-${{ matrix.platform }}-preflight
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install pinned Rust toolchain
        run: ./scripts/ci/install-rust-toolchain.sh 1.95.0 "" "aarch64-apple-darwin,x86_64-apple-darwin"
      - name: Run native isolated acceptance
        run: |
          ./scripts/acceptance/cli-smoke.sh
          RUNONMINE_MCP_SOAK_ITERATIONS=25 ./scripts/acceptance/mcp-http-smoke.sh
          cargo build --locked -p runonmine-desktop
          ./scripts/acceptance/desktop-launch-smoke.sh target/debug/runonmine-desktop
      - name: Build universal portable artifact
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --workspace --exclude xtask
          cargo build --release --locked --target x86_64-apple-darwin --workspace --exclude xtask
          cargo run --locked -p xtask -- universal-macos
          cargo run --locked -p xtask -- package --target universal-apple-darwin
      - name: Validate SBOM and artifact
        run: |
          sbom=$(find dist -maxdepth 1 -name '*universal-apple-darwin-unsigned.sbom.json' -print -quit)
          archive=$(find dist -maxdepth 1 -name '*universal-apple-darwin-unsigned.tar.gz' -print -quit)
          cargo run --locked -p xtask -- validate-sbom --path "$sbom" --target universal-apple-darwin
          ./scripts/acceptance/package-inspect.sh "$archive" "$sbom"
          python3 scripts/acceptance/write-artifact-preflight.py \
            --platform macos-universal --artifact "$archive" \
            --output dist/macos-universal-preflight.json \
            --checks build,checksum,setup,agent_ready,mcp_initialize,approved_tool_call,uninstall,residue_check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runonmine-macos-universal-preflight
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install pinned Rust toolchain
        shell: bash
        run: ./scripts/ci/install-rust-toolchain.sh 1.95.0 "" x86_64-pc-windows-msvc
      - name: Build native debug and run isolated acceptance
        shell: pwsh
        run: |
          cargo build --locked -p runonmine -p runonmine-agent -p runonmine-desktop
          ./scripts/acceptance/windows-smoke.ps1 `
            -RunOnMine target/debug/runonmine.exe `
            -Agent target/debug/runonmine-agent.exe `
            -Desktop target/debug/runonmine-desktop.exe `
            -McpClient scripts/acceptance/mcp-http-smoke.py
      - name: Build portable artifact
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --workspace --exclude xtask
      - shell: pwsh
        run: cargo run --locked -p xtask -- package --target x86_64-pc-windows-msvc
      - name: Validate SBOM and artifact
        shell: bash
        run: |
          sbom=$(find dist -maxdepth 1 -name '*x86_64-pc-windows-msvc-unsigned.sbom.json' -print -quit)
          archive=$(find dist -maxdepth 1 -name '*x86_64-pc-windows-msvc-unsigned.zip' -print -quit)
          cargo run --locked -p xtask -- validate-sbom --path "$sbom" --target x86_64-pc-windows-msvc
          ./scripts/acceptance/package-inspect.sh "$archive" "$sbom"
          python scripts/acceptance/write-artifact-preflight.py \
            --platform windows-x86_64 --artifact "$archive" \
            --output dist/windows-x86_64-preflight.json \
            --checks build,checksum,setup,agent_ready,mcp_initialize,approved_tool_call,uninstall,residue_check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runonmine-windows-x86_64-preflight
          path: dist/*
          if-no-files-found: error

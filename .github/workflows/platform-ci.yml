name: Platform CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: ./scripts/ci/install-rust-toolchain.sh 1.95.0 "clippy" "${{ matrix.target }}"
      - name: Lint headless workspace
        run: >-
          cargo clippy --workspace --exclude runonmine-desktop
          --no-default-features --target ${{ matrix.target }} --all-targets
          --locked -- -D warnings
      - name: Test headless workspace
        run: >-
          cargo test --workspace --exclude runonmine-desktop
          --no-default-features --target ${{ matrix.target }} --locked

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: ./scripts/ci/install-rust-toolchain.sh 1.95.0 "clippy" ""
      - name: Lint desktop-enabled applications
        run: >-
          cargo clippy -p runonmine -p runonmine-agent -p runonmine-desktop
          -p runonmine-helper --all-features --all-targets --locked
          -- -D warnings
      - name: Test desktop-enabled applications
        run: >-
          cargo test -p runonmine -p runonmine-agent -p runonmine-desktop
          -p runonmine-helper --all-features --locked

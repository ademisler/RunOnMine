name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 6"

permissions:
  contents: read

concurrency:
  group: fuzz-main
  cancel-in-progress: true

jobs:
  core-parsers:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=-crt-static
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: nightly-2026-07-18
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz configuration parsing and validation
        run: cargo +nightly-2026-07-18 fuzz run config_toml --target x86_64-unknown-linux-gnu -- -max_total_time=90 -rss_limit_mb=2048
      - name: Fuzz policy rule evaluation
        run: cargo +nightly-2026-07-18 fuzz run policy_engine --target x86_64-unknown-linux-gnu -- -max_total_time=90 -rss_limit_mb=2048
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runonmine-fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

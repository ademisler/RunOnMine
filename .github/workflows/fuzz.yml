name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 6"

permissions:
  contents: read

concurrency:
  group: fuzz-main
  cancel-in-progress: true

jobs:
  core-parsers:
    runs-on: [self-hosted, Linux, X64, runonmine]
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=-crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: nightly-2026-07-18
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz configuration parsing and validation
        run: cargo +nightly-2026-07-18 fuzz run config_toml --target x86_64-unknown-linux-gnu -- -max_total_time=90 -rss_limit_mb=2048
      - name: Fuzz policy rule evaluation
        run: cargo +nightly-2026-07-18 fuzz run policy_engine --target x86_64-unknown-linux-gnu -- -max_total_time=90 -rss_limit_mb=2048
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runonmine-fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

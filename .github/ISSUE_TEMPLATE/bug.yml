name: Bug report
description: Report a reproducible RunOnMine defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS Apple Silicon, macOS Intel, Linux x86_64, Linux ARM64, Windows x86_64, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RunOnMine version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Remove tokens, credentials, personal data, and private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and sensitive machine data from this report.
          required: true

schema = 1

[[gate]]
id = "macos-clean-install"
description = "Install the universal DMG on a clean supported macOS machine, validate native and Rosetta desktop launch, LaunchAgent lifecycle, approved MCP execution, retained-data uninstall, full purge, and reboot evidence."
status = "pending"
required_for = ["private-beta", "public-beta"]
evidence = "Attach the completed acceptance report and artifact SHA-256."

[[gate]]
id = "linux-clean-install"
description = "Install the user and system service paths on a clean Linux x86_64 or ARM64 host, restart, connect, exercise tools, and uninstall."
status = "pending"
required_for = ["private-beta", "public-beta"]
evidence = "Attach systemd status, smoke-test output, and cleanup verification."


[[gate]]
id = "linux-desktop-clean-install"
description = "Install the standalone x86_64 desktop DEB on a clean Linux desktop, validate all seven views, StatusNotifier close/reopen, MCP lifecycle, uninstall, and package-owned residue cleanup."
status = "pending"
required_for = ["private-beta", "public-beta"]
evidence = "Attach the exact DEB/SBOM checksums, desktop-session report, MCP acceptance, uninstall output, and rebooted clean-host evidence."

[[gate]]
id = "windows-clean-install"
description = "Install the current-user NSIS package on a clean Windows x86_64 VM, validate all seven desktop views, WM_CLOSE hide-to-tray, Scheduled Task and optional helper boundaries, approved MCP execution, retained-data uninstall, managed residue, and reboot evidence."
status = "pending"
required_for = ["private-beta", "public-beta"]
evidence = "Attach the Windows acceptance report and installer checksum."

[[gate]]
id = "hosted-platform-matrix"
description = "Run the macOS ARM64/Intel, Windows x86_64, Linux ARM64, and clean-image artifact-preflight matrix including Linux desktop for the release commit."
status = "blocked"
required_for = ["private-beta", "public-beta"]
evidence = "Recent jobs ended before checkout with no assigned runner and no executed steps. Retry after hosted runner allocation is restored; do not infer a billing cause without an explicit GitHub diagnosis."

[[gate]]
id = "windows-helper-security-review"
description = "Review Windows named-pipe ACL, token impersonation, process identity, and allowlisted executable verification on a real Windows VM."
status = "pending"
required_for = ["private-beta", "public-beta"]
evidence = "Attach reviewer notes and negative-test output."

[[gate]]
id = "owner-risk-review"
description = "Present remaining risks, complete-history secret scan results, and acceptance evidence to the repository owner."
status = "pending"
required_for = ["private-beta", "public-beta"]
evidence = "Record the owner approval in the release issue."

[[gate]]
id = "macos-signing-notarization"
description = "Sign the macOS application and installer with an Apple Developer ID and complete notarization."
status = "blocked"
required_for = ["public-beta"]
evidence = "Requires Apple Developer credentials and an owner signing decision."

[[gate]]
id = "windows-code-signing"
description = "Sign the Windows binaries and NSIS installer with a trusted publisher certificate."
status = "blocked"
required_for = ["public-beta"]
evidence = "Requires a Windows code-signing certificate and protected CI secret storage."

[[gate]]
id = "protected-main"
description = "Enforce pull requests, required checks, and review rules on main."
status = "blocked"
required_for = ["public-beta"]
evidence = "The branch-protection check currently returns HTTP 403 requiring GitHub Pro or a public repository. Keep this gate blocked until the policy can be applied and verified."

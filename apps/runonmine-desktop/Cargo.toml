[package]
name = "runonmine-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
publish.workspace = true

[features]
default = ["desktop-ui"]
desktop-ui = ["dep:eframe", "dep:egui", "dep:tray-icon", "dep:ksni"]

[dependencies]
anyhow.workspace = true
command-group.workspace = true
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
runonmine-core.workspace = true
runonmine-oauth.workspace = true
runonmine-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
url.workspace = true
zeroize.workspace = true
secrecy.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { workspace = true, optional = true }

[build-dependencies]
winresource = "0.1.31"

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.winresource]
ProductName = "RunOnMine"
FileDescription = "RunOnMine security control center"
OriginalFilename = "runonmine-desktop.exe"
CompanyName = "RunOnMine contributors"
LegalCopyright = "Copyright RunOnMine contributors"
